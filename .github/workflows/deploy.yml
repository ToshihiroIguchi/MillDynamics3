# Build and deploy the web frontend to GitHub Pages on every push to `main`.
#
# Three jobs, gated in sequence:
#   test   -- the Rust half of the project's quality gate (fmt/clippy/cargo test), from CLAUDE.md.
#   build  -- only runs if `test` passes; builds the wasm core, then the TS half of the gate
#             (`npm run lint`, i.e. tsc) followed by the Vite bundle. `tsc` needs the generated
#             `web/src/wasm/` bindings to resolve `worker.ts`'s import, so it must run after the
#             wasm build -- that's why it lives here and not in `test`.
#   deploy -- only runs if `build` passes; publishes the built bundle to Pages.
# Splitting them (rather than one job) means a broken gate never reaches deploy, and Pages
# credentials (`pages: write` / `id-token: write`) stay scoped to the one job that needs them.
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment at a time; queue rather than race concurrent pushes.
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Quality gate: everything CLAUDE.md requires before a change is considered done.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Build the wasm core, typecheck the frontend against it, then build the static site that
  # `deploy` will publish.
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"

      - run: bash scripts/build-wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  # Publish the artifact `build` uploaded. Least-privilege: only this job gets Pages write access.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
