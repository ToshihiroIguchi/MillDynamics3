[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "milldynamics"
version = "0.1.0"
description = "2D tumbling ball mill simulator (DEM + slurry), prebuilt WASM + web UI"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
milldynamics = "milldynamics.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
milldynamics = ["static/**/*"]
